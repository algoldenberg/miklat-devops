# Полная замена /etc/nginx/nginx.conf из базового образа nginx:1.27-alpine —
# та же структура, отличие только в "pid": вместо дефолтного /run/nginx.pid
# (недоступен на запись непривилегированному пользователю nginx, см.
# Dockerfile-комментарий) — /tmp/nginx.pid. /tmp гарантированно world-writable
# (1777) в любом Linux-образе, в отличие от /run, чьи права на запись зависят
# от того, монтируется ли он как отдельный tmpfs при старте контейнера — и
# тогда любой chown, сделанный на этапе сборки образа, слетает при каждом
# старте контейнера. Поэтому pid переопределён здесь, а не через sed/chown в
# Dockerfile — расширять сюда правки в отдельных local конфигах ("/etc/nginx/conf.d/*.conf") не нужно.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
