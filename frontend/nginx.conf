# Отдаёт собранную статику (SPA) и проксирует "/api/*" на miklat-gateway —
# тот же reverse-proxy приём, что запланирован для настоящего nginx на
# EC2-frontend в Ansible playbooks/nginx.yml (Фаза 2), только здесь backend —
# не набор systemd-сервисов, а один miklat-gateway (Фаза 1 шаг 7).
#
# "miklat-gateway:8000" — фиксированное DNS-имя контейнера из docker-compose
# (одна сеть compose), поэтому зашито прямо в конфиг, а не через env var:
# nginx.conf не шаблонизируется на старте контейнера, в отличие от
# environment: в docker-compose.yml у остальных сервисов. Для локальной
# разработки без docker (`npm run dev`) используется отдельный прокси в
# vite.config.js с тем же смыслом, но настраиваемым URL (VITE_GATEWAY_URL).

server {
    # non-root nginx (см. Dockerfile) не может забиндиться на 80 без
    # CAP_NET_BIND_SERVICE — поэтому сразу 8080, наружу пробрасывается через
    # docker-compose ("3000:8080").
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://miklat-gateway:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
