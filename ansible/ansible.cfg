[defaults]
inventory = inventory.ini
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

; host_key_checking выключен намеренно — это разовый учебный AWS-стенд,
; который создаётся/уничтожается через terraform apply/destroy, поэтому
; ip-адреса хостов не постоянны и SSH host key каждый раз новый. Строгая
; проверка либо потребовала бы чистить known_hosts перед каждым прогоном,
; либо ansible/ssh просто откажется подключаться к "новому" хосту со старым
; IP. Для долгоживущей продакшен-инфраструктуры так делать не стоит.
