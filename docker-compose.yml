services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: miklat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: miklat
      POSTGRES_PASSWORD: miklat_dev_password
      POSTGRES_DB: miklat
    ports:
      - "5432:5432"
    volumes:
      - miklat_pgdata:/var/lib/postgresql/data
      - ./db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miklat -d miklat"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SNS-переменные — тот же dev-топик, что и у miklat-photos (см. его
  # комментарий ниже и README). Без них сервис поднимется нормально,
  # /report просто не отправит уведомление (жалоба всё равно сохранится),
  # а /ready покажет "sns":"not configured"/"down".
  miklat-service:
    build: ./services/miklat-service
    container_name: miklat-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://miklat:miklat_dev_password@postgres:5432/miklat
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-only-change-me}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  miklat-comments:
    build: ./services/miklat-comments
    container_name: miklat-comments
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://miklat:miklat_dev_password@postgres:5432/miklat
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-only-change-me}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Требует предварительно прогнанный osrm/prepare-data.sh (см. osrm/README.md) —
  # без файлов графа в osrm/data/ этот контейнер сразу упадёт при старте.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    container_name: miklat-osrm
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/israel-and-palestine-latest.osrm
    volumes:
      - ./osrm/data:/data:ro
    ports:
      - "5001:5000"
    healthcheck:
      # CMD-SHELL по умолчанию гоняет команду через /bin/sh, а /dev/tcp — это
      # bashism, в дефолтном /bin/sh (dash) в этом образе его нет. Поэтому
      # явно вызываем bash (он в образе есть, т.к. база — Ubuntu).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000 && exec 3<&-"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  miklat-routes:
    build: ./services/miklat-routes
    container_name: miklat-routes
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://miklat:miklat_dev_password@postgres:5432/miklat
      OSRM_BASE_URL: http://osrm:5000
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      osrm:
        condition: service_healthy

  miklat-walking-routes:
    build: ./services/miklat-walking-routes
    container_name: miklat-walking-routes
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://miklat:miklat_dev_password@postgres:5432/miklat
      OSRM_BASE_URL: http://osrm:5000
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
      osrm:
        condition: service_healthy

  # Требует разово созданный вручную dev S3 bucket + SNS topic (см.
  # README / miklat-work-plan.md, Фаза 1 шаг 9) — без реальных
  # AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY/S3_BUCKET_NAME/SNS_TOPIC_ARN
  # сервис всё равно поднимется и ответит на /health, но /ready и сама
  # заливка фото будут падать. Значения передаются либо через реальные
  # переменные окружения шелла, либо через файл `.env` в корне репозитория
  # (docker-compose подхватывает его автоматически; `.env` в .gitignore).
  miklat-photos:
    build: ./services/miklat-photos
    container_name: miklat-photos
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://miklat:miklat_dev_password@postgres:5432/miklat
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-only-change-me}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-}
    ports:
      - "8005:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  miklat_pgdata:
