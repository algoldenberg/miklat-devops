# miklat-gateway — единая точка входа для фронтенда, прокси на 5 сервисов
# ниже по DNS-именам их Service'ов (см. 01-configmap.yaml). Сам не хранит
# ни секретов, ни данных.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miklat-gateway
  namespace: miklat-app
  labels:
    app: miklat-gateway
    part-of: miklat
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miklat-gateway
  template:
    metadata:
      labels:
        app: miklat-gateway
        part-of: miklat
        tier: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: miklat-gateway
          image: ghcr.io/algoldenberg/miklat-gateway:7fb370d
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MIKLAT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: miklat-config
                  key: MIKLAT_SERVICE_URL
            - name: MIKLAT_COMMENTS_URL
              valueFrom:
                configMapKeyRef:
                  name: miklat-config
                  key: MIKLAT_COMMENTS_URL
            - name: MIKLAT_ROUTES_URL
              valueFrom:
                configMapKeyRef:
                  name: miklat-config
                  key: MIKLAT_ROUTES_URL
            - name: MIKLAT_WALKING_ROUTES_URL
              valueFrom:
                configMapKeyRef:
                  name: miklat-config
                  key: MIKLAT_WALKING_ROUTES_URL
            - name: MIKLAT_PHOTOS_URL
              valueFrom:
                configMapKeyRef:
                  name: miklat-config
                  key: MIKLAT_PHOTOS_URL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: miklat-gateway
  namespace: miklat-app
  labels:
    app: miklat-gateway
spec:
  type: ClusterIP
  selector:
    app: miklat-gateway
  ports:
    - port: 8000
      targetPort: 8000
