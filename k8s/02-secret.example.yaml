# Пример структуры Secret'а (Задание 3, п.8 плана) — коммитится с
# ЗАГЛУШКАМИ вместо реальных значений, чтобы было видно, какие ключи
# ожидают Deployment'ы. Реальный Secret с настоящими значениями (RDS
# endpoint/пароль из Terraform Фазы 2, ADMIN_API_KEY, IAM access key
# ограниченного пользователя для S3/SNS) НИКОГДА не должен лежать в git —
# создаётся напрямую в кластере одной kubectl-командой (см. README /
# инструкцию в чате), без промежуточного файла на диске с настоящими
# значениями в открытом виде.
#
# Кластер — self-hosted k3s не на EKS, поэтому IRSA (IAM Roles for Service
# Accounts) недоступен в принципе — единственный практичный вариант для
# доступа приложения к S3/SNS "снаружи" кластера — обычные IAM access
# key/secret ограниченного IAM-пользователя, положенные в Kubernetes
# Secret. Это осознанный компромисс, описанный в README (раздел Security,
# "Secrets management").
apiVersion: v1
kind: Secret
metadata:
  name: miklat-secrets
  namespace: miklat-app
type: Opaque
stringData:
  # Полная строка подключения к RDS PostgreSQL из Terraform (Фаза 2) —
  # тот же формат, что уже использовался в Ansible env-*.j2 шаблонах.
  DATABASE_URL: "postgresql://<db_user>:<db_password>@<rds_endpoint>:5432/<db_name>"
  # Тот же ключ, что используется как X-Admin-Key во всех сервисах.
  ADMIN_API_KEY: "<admin_api_key>"
  # IAM access key ограниченного пользователя (НЕ AdministratorAccess!) —
  # только s3:PutObject/GetObject/ListBucket на miklat-photos-tf-* и
  # sns:Publish/GetTopicAttributes на miklat-notifications-tf. Не тот же
  # instance-profile, что у EC2 в Фазе 2 (instance profile недоступен вне
  # AWS) — отдельный статический ключ, специально созданный для k8s.
  AWS_ACCESS_KEY_ID: "<aws_access_key_id>"
  AWS_SECRET_ACCESS_KEY: "<aws_secret_access_key>"
  SNS_TOPIC_ARN: "arn:aws:sns:il-central-1:232779827681:miklat-notifications-tf"
  S3_BUCKET_NAME: "miklat-photos-tf-232779827681"
