# frontend — статика (React+Vite+Leaflet) через non-root nginx. Никаких
# env vars не нужно: адрес шлюза зашит в frontend/nginx.conf на этапе
# сборки образа ("http://miklat-gateway:8000") — совпадает с именем Service
# miklat-gateway ниже, поэтому уже собранный образ из GHCR работает без
# пересборки. Единственный сервис, у которого будет внешний доступ — через
# Ingress (следующий шаг плана), сюда HTTP не проксируется напрямую из
# интернета.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: miklat-app
  labels:
    app: frontend
    part-of: miklat
    tier: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        part-of: miklat
        tier: frontend
    spec:
      # runAsUser: 101 — UID пользователя nginx в официальном образе
      # nginx:1.27-alpine (стандартный для всех nginx:alpine, не наш выбор).
      # Без явного числового UID kubelet не может проверить runAsNonRoot
      # для non-numeric USER-директивы (USER nginx в Dockerfile, Фаза 1) —
      # падает с "container has runAsNonRoot and image has non-numeric
      # user (nginx), cannot verify user is non-root" (CreateContainerConfigError).
      # Обнаружено на реальном деплое в Фазе 3 (k3s не парсит /etc/passwd
      # образа без его запуска), исправлено явным runAsUser.
      serviceAccountName: miklat-frontend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: frontend
          image: ghcr.io/algoldenberg/frontend:7fb370d
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: miklat-app
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080
