# ServiceAccount'ы (п.10 плана, Фаза 3 — "Разделение прав") — по одному на
# каждую из трёх логических групп сервисов (frontend/backend/worker, та же
# группировка, что и в security_groups.tf Фазы 2 и в лейбле tier: у каждого
# Deployment), а не единый default ServiceAccount для всего namespace.
#
# Ключевое архитектурное решение по RBAC: ни один из 8 workload'ов проекта
# НЕ обращается к Kubernetes API изнутри пода (все они — обычные FastAPI/
# nginx/OSRM процессы, которые говорят по HTTP друг с другом и с внешними
# AWS/RDS, а не с control plane кластера). Поэтому "минимальные права" для
# них — это буквально НОЛЬ прав к API, а не какой-то Role с урезанным, но
# ненулевым набором verbs/resources. Отсюда два следствия:
#   1) Explicit `automountServiceAccountToken: false` на каждом ServiceAccount
#      ниже — под даже не получит токен для обращения к API-серверу, что
#      исключает саму возможность такого обращения, а не просто ограничивает
#      его правами (defense in depth сильнее, чем пустой/urezanный Role).
#   2) Role/RoleBinding с реальными verbs/resources сознательно НЕ созданы —
#      создавать Role с правами, которые ничем не используются, само по себе
#      противоречило бы самому принципу наименьших привилегий. Ни один из трёх
#      ServiceAccount не привязан ни к одной Role/ClusterRole — то есть даже
#      если бы токен был примонтирован, API-сервер отклонил бы любой запрос
#      от этих идентичностей (RBAC deny-by-default). cluster-admin или любая
#      другая широкая роль нигде в проекте не используется.
# Разделение на 3 ServiceAccount при этом всё равно осмысленно даже без
# явных прав: это (а) чёткая идентичность в аудит-логах/kubectl describe
# pod (видно, какой под к какой группе относится, не только по лейблу),
# (б) готовый задел на будущее — если когда-нибудь одной из групп
# понадобится реальный, узкий доступ к API (например, worker'у — читать
# свой ConfigMap через API, а не только через volume/env), у него уже есть
# отдельная идентичность, к которой можно точечно привязать Role, не
# затрагивая остальные две группы.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: miklat-frontend-sa
  namespace: miklat-app
  labels:
    part-of: miklat
    tier: frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: miklat-backend-sa
  namespace: miklat-app
  labels:
    part-of: miklat
    tier: backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: miklat-worker-sa
  namespace: miklat-app
  labels:
    part-of: miklat
    tier: worker
automountServiceAccountToken: false
