# Несекретная конфигурация (Задание 3, п.7 плана): адреса сервисов внутри
# кластера и регион AWS. Значения — реальные и НЕ секретные, поэтому файл
# коммитится как есть (в отличие от 02-secret.example.yaml).
#
# URL-ы построены на именах k8s Service'ов ниже (10-*.yaml..17-*.yaml) —
# Kubernetes DNS резолвит "http://<service-name>:<port>" внутри одного
# namespace без какой-либо дополнительной настройки. Важно: frontend (см.
# frontend/nginx.conf, Фаза 1) уже содержит зашитый хардкодом адрес
# "http://miklat-gateway:8000" — поэтому Service шлюза ниже называется
# ИМЕННО "miklat-gateway", чтобы существующий (уже собранный и запушенный
# в GHCR) образ фронтенда заработал без пересборки.
apiVersion: v1
kind: ConfigMap
metadata:
  name: miklat-config
  namespace: miklat-app
data:
  AWS_REGION: "il-central-1"
  MIKLAT_SERVICE_URL: "http://miklat-service:8000"
  MIKLAT_COMMENTS_URL: "http://miklat-comments:8000"
  MIKLAT_ROUTES_URL: "http://miklat-routes:8000"
  MIKLAT_WALKING_ROUTES_URL: "http://miklat-walking-routes:8000"
  MIKLAT_PHOTOS_URL: "http://miklat-photos:8000"
  OSRM_BASE_URL: "http://osrm:5000"
