apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend
  namespace: miklat-app
  labels:
    app.kubernetes.io/part-of: miklat
spec:
  selector:
    matchLabels:
      app: frontend
  endpoints:
    # port (не targetPort, в отличие от ServiceMonitor'ов backend-сервисов
    # выше) — Service frontend единственный именует свои порты (http/metrics,
    # т.к. их два в одном Service), поэтому здесь корректнее сослаться на имя
    # порта, а не дублировать номер 9113.
    - port: metrics
      path: /metrics
      interval: 15s