# ServiceMonitor'ы для приложения miklat (Задание 5, п.1 — "ServiceMonitor
# или PodMonitor на каждый сервис приложения"): 6 инструментированных
# backend-сервисов + frontend (метрики фронтенда, Задание 5, добавлено
# после основного объёма Фазы 5 — см. miklat-progress.md). Живут в том же
# namespace, что и Service'ы, которые описывают (miklat-app) — по
# умолчанию (без namespaceSelector) ServiceMonitor ищет Endpoints в СВОЁМ
# собственном namespace, поэтому отдельный namespaceSelector не нужен.
#
# Prometheus (namespace observability) видит эти объекты благодаря
# monitoring/values-kube-prometheus-stack.yaml, где
# serviceMonitorSelectorNilUsesHelmValues: false и
# serviceMonitorNamespaceSelector: {} — то есть Prometheus discovery
# включён на ВСЕ namespace, а не только на тот, где установлен сам чарт.
#
# targetPort: 8000 — все 6 backend-сервисов слушают на этом порту (см.
# helm/miklat-app/templates/*.yaml, containerPort: 8000); используем номер
# порта, а не имя, т.к. их Service-манифесты не именуют свои порты —
# trade-off, чтобы не трогать существующие Service-объекты лишний раз.
# У frontend (в самом низу файла) — наоборот, именованный порт (`port:
# metrics`), т.к. его Service отдаёт два порта (http/metrics) и обязан их
# именовать.
#
# path: /metrics — не публикуется через Ingress (см.
# helm/miklat-app/templates/ingress.yaml — там путь `/` ведёт только на
# frontend), то есть эндпоинт достижим только изнутри кластера.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: miklat-service
  namespace: miklat-app
  labels:
    app.kubernetes.io/part-of: miklat
spec:
  selector:
    matchLabels:
      app: miklat-service
  endpoints:
    - targetPort: 8000
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
