# Перенесено из k8s/04-ingress.yaml без изменений — только namespace стал
# {{ .Release.Namespace }}.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: miklat-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: miklat
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
