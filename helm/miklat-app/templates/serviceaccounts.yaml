# Перенесено из k8s/05-serviceaccounts.yaml без изменений логики (см. подробное
# обоснование "ноль прав к API" в оригинальном файле /README проекта, Фаза 3
# п.10) — только namespace стал {{ .Release.Namespace }}.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: miklat-frontend-sa
  namespace: {{ .Release.Namespace }}
  labels:
    part-of: miklat
    tier: frontend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: miklat-backend-sa
  namespace: {{ .Release.Namespace }}
  labels:
    part-of: miklat
    tier: backend
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: miklat-worker-sa
  namespace: {{ .Release.Namespace }}
  labels:
    part-of: miklat
    tier: worker
automountServiceAccountToken: false
