# Перенесено из k8s/10-osrm.yaml без изменений — сторонний образ, тег не
# параметризуется по релизам приложения (см. values.yaml, комментарий у
# osrm.image). Namespace стал {{ .Release.Namespace }}.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osrm
  namespace: {{ .Release.Namespace }}
  labels:
    app: osrm
    part-of: miklat
    tier: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: osrm
  template:
    metadata:
      labels:
        app: osrm
        part-of: miklat
        tier: worker
    spec:
      serviceAccountName: miklat-worker-sa
      containers:
        - name: osrm
          image: {{ .Values.osrm.image }}
          imagePullPolicy: IfNotPresent
          command: ["osrm-routed", "--algorithm", "mld", "/data/israel-and-palestine-latest.osrm"]
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: osrm-data
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: "250m"
              memory: "700Mi"
            limits:
              cpu: "1"
              memory: "1536Mi"
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: osrm-data
          hostPath:
            path: /opt/miklat-devops/osrm/data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: osrm
  namespace: {{ .Release.Namespace }}
  labels:
    app: osrm
spec:
  type: ClusterIP
  selector:
    app: osrm
  ports:
    - port: 5000
      targetPort: 5000
