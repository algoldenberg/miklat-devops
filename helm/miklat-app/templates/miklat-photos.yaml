# Перенесено из k8s/15-miklat-photos.yaml — image/tag стали значениями,
# namespace стал {{ .Release.Namespace }}, остальное без изменений.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miklat-photos
  namespace: {{ .Release.Namespace }}
  labels:
    app: miklat-photos
    part-of: miklat
    tier: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miklat-photos
  template:
    metadata:
      labels:
        app: miklat-photos
        part-of: miklat
        tier: worker
    spec:
      serviceAccountName: miklat-worker-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: miklat-photos
          image: "{{ .Values.imageRegistry }}/miklat-photos:{{ .Values.miklatPhotos.imageTag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            # Задание 5: для app_info{version,git_sha,release} в /metrics.
            - name: GIT_SHA
              value: "{{ .Values.miklatPhotos.imageTag }}"
            - name: RELEASE_NAME
              value: "{{ .Release.Name }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: miklat-secrets
                  key: DATABASE_URL
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: miklat-secrets
                  key: ADMIN_API_KEY
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: miklat-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: miklat-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: miklat-secrets
                  key: S3_BUCKET_NAME
            - name: SNS_TOPIC_ARN
              valueFrom:
                secretKeyRef:
                  name: miklat-secrets
                  key: SNS_TOPIC_ARN
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: miklat-config
                  key: AWS_REGION
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: miklat-photos
  namespace: {{ .Release.Namespace }}
  labels:
    app: miklat-photos
spec:
  type: ClusterIP
  selector:
    app: miklat-photos
  ports:
    - port: 8000
      targetPort: 8000
