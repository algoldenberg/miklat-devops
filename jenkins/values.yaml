# jenkins/values.yaml
# Задание 4, Фаза 4, шаг 1: Jenkins-контроллер в Kubernetes (namespace `jenkins`).
# Официальный Helm-чарт jenkinsci/jenkins, версия зафиксирована при установке
# явным флагом `--version 5.9.29` (не "последняя доступная на момент apply").
# Образ Jenkins тоже зафиксирован ниже — конкретный LTS-тег, не latest/lts alias.
#
# Что делает этот файл (шаг 1, по плану): только сам контроллер — под, PVC,
# ресурсы, пробы, security context, ClusterIP-сервис, минимальный JCasC-скелет.
# Agent pod template'ы (ci-agent/cd-agent, kaniko вместо Docker socket) —
# отдельный шаг 2. Seed job / Job DSL (создание miklat-ci/miklat-cd без UI) —
# отдельный шаг 3. Наружу (Ingress/webhook) Jenkins пока НЕ публикуется —
# это решение шага про CI-триггер (шаг 4), сейчас доступ только через
# `kubectl port-forward` для первичной проверки/логина.

controller:
  image:
    registry: docker.io
    repository: jenkins/jenkins
    tag: "2.555.3-lts-jdk21"       # зафиксированная LTS-версия, не "lts"/"latest"
  imagePullPolicy: IfNotPresent

  # Учётка администратора: секрет создаётся пользователем императивно (см.
  # инструкцию в чате) — реальный пароль нигде не пишется ни в этот файл,
  # ни в репозиторий, по аналогии с miklat-secrets в Фазе 3.
  admin:
    existingSecret: jenkins-admin-secret
    userKey: jenkins-admin-user
    passwordKey: jenkins-admin-password

  # Контроллер сам ничего не билдит — он только диспетчер, реальные сборки
  # всегда идут на динамических agent'ах (Kubernetes plugin, шаг 2). Это же
  # снижает нагрузку/риски на под, который держит state (PVC).
  numExecutors: 0

  # Фаза 4, шаг 3: плагин Job DSL — нужен, чтобы описать job'ы
  # `miklat-ci`/`miklat-cd` кодом (JCasC-ключ `jobs:` ниже), а не создавать
  # их руками через UI.
  # Фаза 4, шаг 4.2 (реальный баг, найден на этом шаге): плагин `github` —
  # дефолтный набор плагинов чарта его не включает. Без него `/github-webhook/`
  # не зарегистрирован как `UnprotectedRootAction` — Jenkins считает путь
  # обычным защищённым URL и отвечает 403 с редиректом на /login вместо того,
  # чтобы принять anonymous POST от GitHub. Тот же плагин даёт Job DSL-метод
  # `githubPush()` для триггера сборки по push (нужен на шаге 4.3).
  additionalPlugins:
    - "job-dsl:3732.v9a_c49a_61a_313"
    - "github:1.47.0"

  # Фаза 4, шаг 4.1: GHCR-credentials для CI как код. Реальный токен нигде
  # в этом файле/репозитории не встречается — секрет `jenkins-ghcr-credentials`
  # создаётся императивно (kubectl create secret), та же практика, что и
  # `jenkins-admin-secret` на шаге 1. Здесь только ССЫЛКА на существующий
  # secret — значения подставляются Kubernetes в под как переменные
  # окружения, а JCasC ниже (`credentials:`) забирает их оттуда через
  # `${GHCR_USERNAME}`/`${GHCR_TOKEN}` и создаёт из них Jenkins Credential
  # `ghcr-credentials`, которую дальше использует `Jenkinsfile-ci`.
  containerEnv:
    - name: GHCR_USERNAME
      valueFrom:
        secretKeyRef:
          name: jenkins-ghcr-credentials
          key: username
    - name: GHCR_TOKEN
      valueFrom:
        secretKeyRef:
          name: jenkins-ghcr-credentials
          key: token
    # Фаза 4, шаг 4.3: shared secret для проверки подписи GitHub webhook
    # (X-Hub-Signature-256) — тот же принцип, что и GHCR-токен выше: значение
    # только в k8s Secret, сюда попадает только имя переменной.
    - name: GITHUB_WEBHOOK_SECRET
      valueFrom:
        secretKeyRef:
          name: jenkins-github-webhook-secret
          key: secret

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "2Gi"

  serviceType: ClusterIP
  ingress:
    enabled: false

  # Явные пробы вместо чартовых дефолтов — требование плана (Задание 3 уже
  # приучило нас всегда задавать resources+probes явно, тот же принцип здесь).
  probes:
    startupProbe:
      httpGet:
        path: /login
        port: http
      failureThreshold: 60
      periodSeconds: 5
      timeoutSeconds: 5
    livenessProbe:
      httpGet:
        path: /login
        port: http
      periodSeconds: 10
      failureThreshold: 5
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /login
        port: http
      periodSeconds: 10
      failureThreshold: 3
      timeoutSeconds: 5

  # Container security — тот же принцип, что и в Фазе 3 (runAsNonRoot,
  # без privilege escalation). uid 1000 — штатный jenkins-пользователь
  # официального образа, ничего кастомного.
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

  podSecurityContextOverride:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  # JCasC: минимальный скелет на шаг 1 (только системные настройки), без
  # security-realm/credentials-специфики — она добавится в шаге 7 (Security),
  # когда будем явно разводить RBAC/credentials под CI и CD.
  #
  # Важно: `numExecutors`/`mode` здесь НЕ дублируем — чарт сам генерирует
  # собственный служебный jcasc-default-config.yaml из controller.numExecutors,
  # и повторное указание того же ключа в кастомном configScript ловится
  # плагином configuration-as-code как КОНФЛИКТ (ErrorOnConflictMergeStrategy),
  # даже если значение совпадает — Jenkins из-за этого падал при старте
  # (ConfiguratorConflictException на строке `mode: NORMAL`). Здесь оставляем
  # только то, что больше нигде не задаётся.
  JCasC:
    defaultConfig: true
    configScripts:
      basic-settings: |
        jenkins:
          systemMessage: "miklat-devops CI/CD — Jenkins управляется через JCasC, Helm values в Git, ручная настройка через UI не используется."

      # Фаза 4, шаг 3: Jobs как код через плагин Job DSL. Ключ `jobs:` —
      # отдельный корневой JCasC-элемент (не `jenkins:`), поэтому конфликта
      # со скриптом `basic-settings` выше нет — это два разных ключа верхнего
      # уровня, а не два источника для ОДНОГО и того же поля (тот класс
      # проблемы мы уже ловили на шаге 1 и знаем, как он выглядит).
      # Скрипт выполняется при каждом старте/reload контроллера — job'ы
      # создаются/обновляются автоматически, без seed-job'а, который нужно
      # было бы руками запускать через UI ("Build Now").
      # ВАЖНО: сами файлы `Jenkinsfile-ci`/`Jenkinsfile-cd` в репозитории
      # ещё не существуют (это шаги 4 и 5) — job'ы уже сейчас определены и
      # видны в Jenkins, но соберутся успешно только после появления этих
      # файлов. Это ожидаемо и не является ошибкой этого шага.
      #
      # ВАЖНО (найдено при отладке, реальный краш при старте): `jobs:`
      # принимает СПИСОК скриптов — каждый job должен быть ОТДЕЛЬНЫМ
      # элементом списка (`- script: |`), а не двумя `pipelineJob(...)`
      # подряд внутри одного `script:`. Изначально оба job'а были в одном
      # `script: >` (folded-стиль YAML) без пустой строки между ними —
      # folded-скаляр схлопывает обычные переводы строк в пробелы, из-за
      # чего весь скрипт слился в одну строку. Job DSL поддерживает
      # Groovy command-chain синтаксис (`job('x') { }` без точек и скобок
      # вызова), и без реального переноса строки между двумя `pipelineJob`
      # парсер принял второй вызов за МЕТОД на объекте, который вернул
      # первый (`WorkflowJob.pipelineJob()` — то есть `A(){}.B(){}` вместо
      # двух независимых top-level выражений), что падало с
      # `MissingMethodException` прямо на старте Jenkins (Fatal error
      # инициализации, под уходил в CrashLoopBackOff). Исправлено: каждый
      # job — свой элемент списка `jobs:`, свой `script: |` (literal-стиль,
      # переводы строк сохраняются как есть, сворачивания нет в принципе).
      seed-jobs: |
        jobs:
          - script: |
              pipelineJob('miklat-ci') {
                description('CI: checkout, validate, lint, tests, build & push образов в GHCR. Управляется как код (Job DSL) — не редактировать через UI.')
                triggers {
                  githubPush()
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote { url('https://github.com/algoldenberg/miklat-devops.git') }
                        branch('main')
                      }
                    }
                    scriptPath('Jenkinsfile-ci')
                  }
                }
              }
          - script: |
              // Задание 5, исправление реального бага: изолированная сборка+push
              // ОДНОГО сервиса через kaniko, в СВОЁМ собственном поде (agent
              // build-agent, agent.podRetention: Never). Вызывается из
              // Jenkinsfile-ci по одному разу на каждый изменившийся сервис
              // (build job: 'miklat-build', wait: true) вместо прежнего цикла
              // /kaniko/executor в одном общем контейнере — тот подход
              // "протекал" файловой системой между сборками разных сервисов
              // (подробный разбор с реальными логами — в самом Jenkinsfile-build).
              pipelineJob('miklat-build') {
                description('Build: изолированная сборка и push ОДНОГО образа через kaniko в своём поде. Вызывается из miklat-ci. Управляется как код (Job DSL) — не редактировать через UI.')
                parameters {
                  choiceParam(
                    'SERVICE_NAME',
                    ['miklat-service', 'miklat-comments', 'miklat-routes', 'miklat-walking-routes', 'miklat-photos', 'miklat-gateway', 'frontend'],
                    'Какой сервис собирать (значение из CHANGED_SERVICES в Jenkinsfile-ci)'
                  )
                  stringParam('GIT_SHA', '', 'Commit-SHA, который нужно собрать (тот же env.GIT_SHA, что и в miklat-ci)')
                  // Реальный инцидент 03.09.2026: registry-кэш kaniko (--cache=true)
                  // успел закэшировать испорченный слой RUN pip install (без
                  // fastapi/uvicorn/prometheus_*) для 5 сервисов на коммите c0a2de5,
                  // пока сборки ещё шли в одном общем контейнере. После изоляции по
                  // подам это само по себе не повторится, но старые отравленные записи
                  // кэша для УЖЕ существующих коммитов остаются в реестре и будут
                  // переиспользованы повторно (подтверждено на практике). Этот
                  // чекбокс — ручной способ форсировать пересборку в обход кэша для
                  // таких случаев; по умолчанию выключен, обычный путь CI им не
                  // пользуется.
                  booleanParam('NO_CACHE', false, 'Собрать без registry-кэша kaniko (--cache=false) — использовать при подозрении на испорченный/устаревший кэш для этого коммита')
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote { url('https://github.com/algoldenberg/miklat-devops.git') }
                        branch('main')
                      }
                    }
                    scriptPath('Jenkinsfile-build')
                  }
                }
              }
          - script: |
              pipelineJob('miklat-cd') {
                description('CD: деплой готового образа (по tag/digest) в namespace miklat-app. Управляется как код (Job DSL) — не редактировать через UI.')
                parameters {
                  // choiceParam, а не stringParam: один тег коммита (SHA) —
                  // это образы СРАЗУ нескольких сервисов (каждый в своём
                  // repo в GHCR), поэтому Jenkinsfile-cd не может понять,
                  // какой именно Deployment/values.yaml-ключ обновлять, без
                  // явного указания сервиса. Список — ровно те строки,
                  // которые CHANGED_SERVICES считает в Jenkinsfile-ci
                  // (helm/miklat-app/values.yaml исключает osrm — сторонний
                  // образ, не собирается и не деплоится этим CI/CD).
                  // Синтаксис choiceParam(name, [choices], description)
                  // проверен по первоисточнику: jenkinsci/job-dsl-plugin,
                  // job-dsl-core/.../BuildParametersContext/choiceParam.groovy.
                  choiceParam(
                    'SERVICE_NAME',
                    ['miklat-service', 'miklat-comments', 'miklat-routes', 'miklat-walking-routes', 'miklat-photos', 'miklat-gateway', 'frontend'],
                    'Какой сервис деплоить (значение из CHANGED_SERVICES в Jenkinsfile-ci)'
                  )
                  stringParam('IMAGE_TAG', '', 'Тег образа (commit-SHA), собранный джобом miklat-ci')
                  stringParam('IMAGE_DIGEST', '', 'Digest образа для доп. traceability (необязательно)')
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote { url('https://github.com/algoldenberg/miklat-devops.git') }
                        branch('main')
                      }
                    }
                    scriptPath('Jenkinsfile-cd')
                  }
                }
              }

      # Фаза 4, шаги 4.1+4.3: JCasC-ключ `credentials:` — отдельный корневой
      # элемент (не `jenkins:`/`jobs:`), конфликта с ними нет (тот же
      # принцип, что уже подтверждён на шаге 3 для `jobs:`). ОБА credential'а
      # (GHCR push и GitHub webhook secret) — в ОДНОМ конфиг-скрипте: если бы
      # они лежали в двух РАЗНЫХ configScripts, каждый со своим корневым
      # ключом `credentials:`, это был бы ровно тот конфликт двух источников
      # одного ключа, что уже уронил Jenkins на шаге 1
      # (ErrorOnConflictMergeStrategy) — внутри одного скрипта список из
      # нескольких credential'ов, наоборот, штатный и ожидаемый способ
      # использования JCasC. Оба значения приходят из переменных окружения
      # пода (`containerEnv` выше, из k8s Secret) — сами секреты даже
      # транзитом не проходят через этот файл, только имена переменных.
      ci-credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      scope: GLOBAL
                      id: "ghcr-credentials"
                      username: "${GHCR_USERNAME}"
                      password: "${GHCR_TOKEN}"
                      description: "GHCR push credentials for CI (dedicated fine-grained-unsupported classic PAT, scope write:packages)"
                  - string:
                      scope: GLOBAL
                      id: "github-webhook-secret"
                      secret: "${GITHUB_WEBHOOK_SECRET}"
                      description: "GitHub webhook shared secret (validates X-Hub-Signature-256 on /github-webhook/)"

      # Фаза 4, шаг 4.3: подключаем этот credential к самому GitHub-плагину,
      # чтобы Jenkins реально проверял подпись входящих POST на
      # /github-webhook/ и отклонял payload с неверным secret'ом — без этого
      # эндпоинт принимал бы ЛЮБОЙ POST, пришедший на публичный путь из
      # шага 4.2, без проверки, что он реально от GitHub. Ключ верхнего
      # уровня `unclassified` — снова отдельный корень, конфликта с
      # `jenkins:`/`jobs:`/`credentials:` нет. Синтаксис (`githubpluginconfig`
      # в нижнем регистре, `hookSecretConfigs` как СПИСОК) сверен с
      # исходником плагина (`GitHubPluginConfig.java`/тестовым JCasC-фикстуром
      # в репозитории jenkinsci/github-plugin), не угадан.
      github-webhook-secret-config: |
        unclassified:
          githubpluginconfig:
            hookSecretConfigs:
              - credentialsId: "github-webhook-secret"

  persistence:
    enabled: true
    storageClass: local-path     # штатный default StorageClass в k3s
    size: 8Gi

# Kubernetes plugin (chart ставит его сам) — это ЕДИНСТВЕННЫЙ компонент во
# всём проекте, которому реально нужны права в K8s API (создавать/удалять
# agent-поды в namespace `jenkins`), в отличие от Фазы 3, где все 8 сервисов
# приложения сознательно получили нулевой RBAC. Здесь чарт по умолчанию
# создаёт узкую Role, ограниченную namespace `jenkins` (не ClusterRole,
# никакого cluster-admin) — подробное обоснование пойдёт в README (шаг 7,
# Security), сейчас оставляем чартовый дефолт.
rbac:
  create: true
  readSecrets: false

agent:
  # Фаза 4, шаг 2: дефолтный generic jnlp pod template чарта отключён —
  # используем только два целевых template'а ниже (ci-agent/cd-agent), как
  # того требует план. Kubernetes Cloud уже настроена чартом на шаге 1
  # (namespace `jenkins`, ServiceAccount, RBAC), наши template'ы
  # регистрируются в ней же через нативный ключ `podTemplates` (в отличие от
  # кастомного JCasC configScript — это не создаёт риска конфликта, который
  # мы уже ловили на шаге 1: `podTemplates` — собственный механизм чарта,
  # а не второй независимый источник JCasC).
  #
  # ВАЖНО (найдено при отладке): `agent.enabled: false` — это НЕ "убрать
  # только дефолтный template", как можно подумать по названию. Это флаг
  # уровня "генерировать ли вообще секцию `templates:` внутри Kubernetes
  # Cloud" — при false пропадают И дефолтный, И кастомные `podTemplates`
  # разом (проверено по исходнику `_helpers.tpl` чарта: `podTemplates`
  # рендерится ВНУТРИ той же ветки, что и дефолтный агент, а не отдельно).
  # Правильная комбинация — `enabled: true` (сама секция `templates`
  # генерируется) + `disableDefaultAgent: true` (внутри неё пропускается
  # только автосгенерированный дефолтный template, кастомные остаются).
  enabled: true
  disableDefaultAgent: true

  # Общие для всей Kubernetes Cloud настройки (относятся ко ВСЕМ pod
  # template'ам, не только к отключённому дефолтному):
  podRetention: Never    # под живёт ровно на время сборки — ephemeral workspace по плану
  containerCap: 5        # не больше 5 одновременных agent-подов (защита от перегрузки узла)

  # -- Кастомные pod template'ы для Kubernetes Cloud (Фаза 4, шаг 2) --
  # Фаза 4, шаг 5.2: ci-agent по-прежнему БЕЗ явного ServiceAccount — значит,
  # используется дефолтный `jenkins` SA из namespace `jenkins` (права только
  # на управление подами в СВОЁМ namespace, никакого доступа к miklat-app).
  # cd-agent теперь явно использует ServiceAccount `jenkins-cd`
  # (jenkins/cd-rbac.yaml) — у него, и только у него, есть права (через
  # кросс-namespace RoleBinding) управлять ресурсами в namespace `miklat-app`
  # (то самое разделение CI/CD прав из п.7 плана, реализованное раньше
  # официального "шага 7", т.к. без него Jenkinsfile-cd физически не сможет
  # аутентифицироваться для деплоя — это функциональная, а не косметическая
  # часть шага 5).
  #
  # Поле `serviceAccount` — подтверждено по исходнику kubernetes-plugin
  # (PodTemplate.java, @DataBoundSetter setServiceAccount(String)), маппится
  # на spec.serviceAccountName пода, не угадано.
  podTemplates:
    ciAgent: |
      - name: ci-agent
        label: ci-agent
        containers:
          - name: git
            image: alpine/git:2.54.0
            command: "cat"
            args: ""
            ttyEnabled: true
            resourceRequestCpu: "100m"
            resourceRequestMemory: "128Mi"
            resourceLimitCpu: "250m"
            resourceLimitMemory: "256Mi"
          - name: python-tools
            image: python:3.12-slim
            command: "cat"
            args: ""
            ttyEnabled: true
            resourceRequestCpu: "250m"
            resourceRequestMemory: "512Mi"
            resourceLimitCpu: "500m"
            resourceLimitMemory: "1Gi"
          - name: node-tools
            image: node:22-slim
            command: "cat"
            args: ""
            ttyEnabled: true
            resourceRequestCpu: "250m"
            resourceRequestMemory: "512Mi"
            resourceLimitCpu: "500m"
            resourceLimitMemory: "1Gi"
    # Задание 5, исправление реального бага: контейнер kaniko здесь БЫЛ, но
    # переехал в отдельный под-шаблон buildAgent ниже. Раньше Jenkinsfile-ci
    # гонял ВСЕ 6 сборок kaniko последовательно в этом одном общем
    # контейнере — kaniko не сбрасывает файловую систему между вызовами
    # /kaniko/executor, из-за чего pip install одной сборки "протекал" в
    # следующую (реально проверено: 5 из 6 запушенных образов оказались
    # без своих Python-зависимостей — подробности в Jenkinsfile-build).
    # Теперь ci-agent строит/лидирует только checkout+lint+test+detect, а
    # каждая сборка образа идёт в СВОЁМ собственном поде job'ы miklat-build
    # (agent.podRetention: Never ниже это гарантирует).
    buildAgent: |
      - name: build-agent
        label: build-agent
        containers:
          - name: git
            image: alpine/git:2.54.0
            command: "cat"
            args: ""
            ttyEnabled: true
            resourceRequestCpu: "100m"
            resourceRequestMemory: "128Mi"
            resourceLimitCpu: "250m"
            resourceLimitMemory: "256Mi"
          - name: kaniko
            image: gcr.io/kaniko-project/executor:v1.23.2-debug
            command: "cat"
            args: ""
            ttyEnabled: true
            privileged: false
            resourceRequestCpu: "250m"
            resourceRequestMemory: "512Mi"
            resourceLimitCpu: "1"
            resourceLimitMemory: "1536Mi"
    cdAgent: |
      - name: cd-agent
        label: cd-agent
        serviceAccount: jenkins-cd
        containers:
          - name: kubectl-helm
            image: dtzar/helm-kubectl:4.2.3
            command: "cat"
            args: ""
            ttyEnabled: true
            resourceRequestCpu: "100m"
            resourceRequestMemory: "256Mi"
            resourceLimitCpu: "500m"
            resourceLimitMemory: "512Mi"